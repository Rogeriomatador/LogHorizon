name: LogHorizonGardenPlus
version: 1.0.0
main: br.com.loghorizon.gardenplus.LogHorizonGardenPlus
api-version: '1.21'
author: Log Horizon
description: Integra Garden 2.0.1 ao AuraSkills com raridades, qualidades e plantas especiais.
depend:
  - Garden
  - AuraSkills
commands:
  lhgarden:
    description: Recarrega o LogHorizonGardenPlus.
    usage: /lhgarden reload
    permission: loghorizon.gardenplus.admin
permissions:
  loghorizon.gardenplus.admin:
    description: Permite administrar o complemento GardenPlus.
    default: op
