name: Build GardenPlus

on:
  push:
    branches:
      - build-gardenplus-20260726
    paths:
      - 'gardenplus/**'
      - '.github/workflows/build-gardenplus.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'gardenplus/**'
      - '.github/workflows/build-gardenplus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download Garden 2.0.1 dependency
        shell: python
        run: |
          import json
          import pathlib
          import urllib.request

          api = 'https://api.modrinth.com/v2/project/ePND7F16/version'
          request = urllib.request.Request(api, headers={'User-Agent': 'LogHorizonGardenPlus/1.0'})
          with urllib.request.urlopen(request) as response:
              versions = json.load(response)

          selected = next((v for v in versions if v.get('version_number') == '2.0.1'), None)
          if selected is None:
              raise SystemExit('Garden 2.0.1 was not found on Modrinth')

          files = selected.get('files', [])
          selected_file = next((f for f in files if f.get('primary')), files[0] if files else None)
          if selected_file is None:
              raise SystemExit('Garden 2.0.1 has no downloadable file')

          target = pathlib.Path('gardenplus/lib/Garden-2.0.1.jar')
          target.parent.mkdir(parents=True, exist_ok=True)
          urllib.request.urlretrieve(selected_file['url'], target)
          print(f'Downloaded {target} ({target.stat().st_size} bytes)')

      - name: Build plugin
        run: mvn -B -f gardenplus/pom.xml clean package

      - name: Prepare files
        run: |
          mkdir -p gardenplus/dist/jar gardenplus/dist/config
          cp gardenplus/target/LogHorizonGardenPlus.jar gardenplus/dist/jar/
          cp gardenplus/src/main/resources/config.yml gardenplus/dist/config/config.yml
          cp gardenplus/INSTALACAO.txt gardenplus/dist/config/INSTALACAO.txt
          sha256sum gardenplus/dist/jar/LogHorizonGardenPlus.jar > gardenplus/dist/jar/SHA256.txt

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: LogHorizonGardenPlus-JAR
          path: gardenplus/dist/jar/
          if-no-files-found: error

      - name: Upload configuration
        uses: actions/upload-artifact@v4
        with:
          name: LogHorizonGardenPlus-CONFIG
          path: gardenplus/dist/config/
          if-no-files-found: error
