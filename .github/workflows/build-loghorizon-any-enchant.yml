name: Build LogHorizonAnyEnchant

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-loghorizon-any-enchant.yml
  pull_request:
    branches: [main]
    paths:
      - plugins/LogHorizonAnyEnchant/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/loghorizon-any-enchant
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin
        working-directory: plugins/LogHorizonAnyEnchant
        shell: bash
        run: |
          mkdir -p build-artifacts
          set -o pipefail
          mvn -B clean package 2>&1 | tee build-artifacts/maven-build.log
          cp target/LogHorizonAnyEnchant-1.0.0-LH1.jar build-artifacts/LogHorizonAnyEnchant-1.0.0-LH1.jar
          sha256sum build-artifacts/LogHorizonAnyEnchant-1.0.0-LH1.jar > build-artifacts/LogHorizonAnyEnchant-1.0.0-LH1.sha256
          jar tf build-artifacts/LogHorizonAnyEnchant-1.0.0-LH1.jar | grep -q 'com/loghorizon/anyenchant/LogHorizonAnyEnchant.class'
          unzip -p build-artifacts/LogHorizonAnyEnchant-1.0.0-LH1.jar plugin.yml | grep -q 'api-version: .26.2.'

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogHorizonAnyEnchant-1.0.0-LH1
          path: |
            plugins/LogHorizonAnyEnchant/build-artifacts/LogHorizonAnyEnchant-1.0.0-LH1.jar
            plugins/LogHorizonAnyEnchant/build-artifacts/LogHorizonAnyEnchant-1.0.0-LH1.sha256
            plugins/LogHorizonAnyEnchant/build-artifacts/maven-build.log
          if-no-files-found: error

      - name: Publish build result to feature branch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f plugins/LogHorizonAnyEnchant/build-artifacts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Compilar LogHorizonAnyEnchant 1.0.0-LH1 [skip ci]'
          git push origin HEAD:feature/loghorizon-any-enchant
