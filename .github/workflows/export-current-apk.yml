name: Export current Android APK

on:
  push:
    branches:
      - agent/export-current-apk
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar site
        uses: actions/checkout@v4

      - name: Validar APK atual
        shell: bash
        run: |
          set -euo pipefail
          test -s downloads/LogHorizonVoice-latest.apk
          sha256sum downloads/LogHorizonVoice-latest.apk

      - name: Disponibilizar APK atual
        uses: actions/upload-artifact@v4
        with:
          name: LogHorizonVoice-oficial-0.5.0
          path: downloads/LogHorizonVoice-latest.apk
          if-no-files-found: error
          retention-days: 1
