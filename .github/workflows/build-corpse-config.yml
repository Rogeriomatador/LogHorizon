name: Build Corpse Config

on:
  pull_request:
    paths:
      - 'corpse-config/**'
      - '.github/workflows/build-corpse-config.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar configuração
        run: |
          grep -q 'itemTreatment: "pop"' corpse-config/config.yml
          grep -q 'xpTreatment: "pop"' corpse-config/config.yml
          grep -q 'lifespan: -1' corpse-config/config.yml

      - name: Gerar ZIP
        run: |
          mkdir -p dist
          cp corpse-config/config.yml dist/config.yml
          cp corpse-config/INSTALACAO.txt dist/INSTALACAO.txt
          cd dist
          sha256sum config.yml > SHA256.txt
          zip -9 LogHorizon-Corpse-1.3.1-CONFIG.zip config.yml INSTALACAO.txt SHA256.txt
          unzip -t LogHorizon-Corpse-1.3.1-CONFIG.zip

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: LogHorizon-Corpse-1.3.1-CONFIG
          path: dist/LogHorizon-Corpse-1.3.1-CONFIG.zip
          if-no-files-found: error
