name: Build ResourcePackManager LH2

on:
  push:
    branches:
      - feature/resourcepackmanager-lh2-3ddefault
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Log Horizon
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Clone ResourcePackManager 2.3.0 source
        run: |
          git clone https://github.com/MagmaGuy/ResourcePackManager.git upstream
          git -C upstream checkout b2c36b726bed67f1ca5b81f6f33ae90b7a32b05b

      - name: Apply Log Horizon LH2 patches
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('upstream')

          # ------------------------------------------------------------
          # LH1: do not duplicate Geyser's built-in furnace minecart item.
          # ------------------------------------------------------------
          mapping = root / 'resourcepackmanager-bedrock/src/main/java/com/magmaguy/resourcepackmanager/bedrock/generic/GenericGeyserMappingBuilder.java'
          s = mapping.read_text(encoding='utf-8')

          anchor = '    private GenericGeyserMappingBuilder() {}'
          assert anchor in s
          s = s.replace(anchor, '''    /** Items for which Geyser already registers an unconditional Bedrock definition. */
    private static final Set<String> GEYSER_BUILTIN_DEFAULT_ITEMS = Set.of(
            "minecraft:furnace_minecart"
    );

    private GenericGeyserMappingBuilder() {}''')

          old = '''        TreeMap<String, List<JsonObject>> byBase = new TreeMap<>();

        // Convert generic entries — one array per base item.'''
          assert old in s
          s = s.replace(old, '''        TreeMap<String, List<JsonObject>> byBase = new TreeMap<>();
        int skippedBuiltinDefaults = 0;

        // Convert generic entries — one array per base item.''')

          old = '''            List<JsonObject> jsons = new ArrayList<>();
            for (GeyserDefinitionEntry ge : entries) {
                jsons.add(buildGenericEntry(ge, base));
            }
            byBase.put(base, jsons);'''
          assert old in s
          s = s.replace(old, '''            List<JsonObject> jsons = new ArrayList<>();
            for (GeyserDefinitionEntry ge : entries) {
                boolean unconditional = ge.predicates() == null || ge.predicates().isEmpty();
                if (unconditional && GEYSER_BUILTIN_DEFAULT_ITEMS.contains(base)) {
                    skippedBuiltinDefaults++;
                    BedrockLog.debug("[BedrockConverter] Skipping Geyser built-in default mapping for "
                            + base + " (" + ge.bedrockIdentifier() + ")");
                    continue;
                }
                jsons.add(buildGenericEntry(ge, base));
            }
            if (!jsons.isEmpty()) {
                byBase.put(base, jsons);
            }''')

          old = '''            BedrockLog.debug("[BedrockConverter] Wrote merged Geyser mappings: "
                    + total + " entries across " + baseCount + " base items -> "
                    + outputFile.getAbsolutePath());'''
          assert old in s
          s = s.replace(old, old + '''
            if (skippedBuiltinDefaults > 0) {
                BedrockLog.info("[BedrockConverter] Log Horizon compatibility: skipped "
                        + skippedBuiltinDefaults + " Geyser built-in default mapping(s); Java pack content was preserved.");
            }''')
          mapping.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------
          # LH2: native Bedrock texture fallback for single-texture 3D
          # vanilla models, such as the tools from 3D Default.
          # ------------------------------------------------------------
          stitcher = root / 'resourcepackmanager-bedrock/src/main/java/com/magmaguy/resourcepackmanager/bedrock/converter/TextureStitcher.java'
          s = stitcher.read_text(encoding='utf-8')

          old = '''        if (loadedByRef.isEmpty()) {
            if (!missingCustom.isEmpty()) {'''
          assert old in s
          s = s.replace(old, '''        if (loadedByRef.isEmpty()) {
            StitchResult nativeFallback = tryNativeVanillaFallback(modelName, textureMap, sortedIndices);
            if (nativeFallback != null) {
                return nativeFallback;
            }

            if (!missingCustom.isEmpty()) {''')

          anchor = '''    private static int compareSlotKeys(String a, String b) {'''
          assert anchor in s
          helper = r'''    /**
     * When a Java 3D model uses exactly one vanilla texture, the PNG is normally absent
     * from the server resource pack because both Java and Bedrock ship it themselves.
     * Bedrock attachables may reference that built-in texture directly, so no copied
     * atlas is required. A virtual 16x16 sprite supplies the UV coordinate space.
     */
    private static StitchResult tryNativeVanillaFallback(String modelName,
                                                          Map<String, String> textureMap,
                                                          List<String> sortedIndices) {
        LinkedHashSet<String> uniqueRefs = new LinkedHashSet<>();
        for (String index : sortedIndices) {
            String ref = textureMap.get(index);
            if (ref != null && !ref.isBlank()) uniqueRefs.add(ref);
        }
        if (uniqueRefs.size() != 1) return null;

        String textureRef = uniqueRefs.iterator().next();
        if (!"minecraft".equals(BedrockNaming.extractNamespace(textureRef))) return null;

        String bedrockTexturePath = bedrockVanillaTexturePath(textureRef);
        if (bedrockTexturePath == null) return null;

        Map<String, SpriteInfo> spriteMap = new LinkedHashMap<>();
        SpriteInfo fullTexture = new SpriteInfo(0, 0, 16, 16);
        for (String index : sortedIndices) {
            if (textureRef.equals(textureMap.get(index))) {
                spriteMap.put(stripHash(index), fullTexture);
            }
        }
        if (spriteMap.isEmpty()) return null;

        BedrockLog.info("[BedrockConverter] Log Horizon LH2: using Bedrock vanilla texture for 3D model "
                + modelName + ": " + textureRef + " -> " + bedrockTexturePath);
        return new StitchResult(null, 16, 16, spriteMap, bedrockTexturePath, Map.of());
    }

    /** Maps common Java vanilla texture names to their Bedrock built-in paths. */
    private static String bedrockVanillaTexturePath(String textureRef) {
        String path = BedrockNaming.extractPath(textureRef);
        if (path.startsWith("block/")) {
            return "textures/blocks/" + path.substring("block/".length());
        }
        if (!path.startsWith("item/")) return null;

        String item = path.substring("item/".length());
        return switch (item) {
            case "wooden_sword" -> "textures/items/wood_sword";
            case "wooden_pickaxe" -> "textures/items/wood_pickaxe";
            case "wooden_axe" -> "textures/items/wood_axe";
            case "wooden_shovel" -> "textures/items/wood_shovel";
            case "wooden_hoe" -> "textures/items/wood_hoe";
            case "golden_sword" -> "textures/items/gold_sword";
            case "golden_pickaxe" -> "textures/items/gold_pickaxe";
            case "golden_axe" -> "textures/items/gold_axe";
            case "golden_shovel" -> "textures/items/gold_shovel";
            case "golden_hoe" -> "textures/items/gold_hoe";
            case "red_mushroom" -> "textures/blocks/mushroom_red";
            case "brown_mushroom" -> "textures/blocks/mushroom_brown";
            default -> "textures/items/" + item;
        };
    }

'''
          s = s.replace(anchor, helper + anchor)
          stitcher.write_text(s, encoding='utf-8')

          # Use the same Bedrock built-in texture for the custom item's inventory icon.
          conversion = root / 'resourcepackmanager-bedrock/src/main/java/com/magmaguy/resourcepackmanager/bedrock/BedrockConversion.java'
          s = conversion.read_text(encoding='utf-8')
          old = '''            String iconRel = "textures/items/" + iconKey;
            File iconFile = new File(bedrockDir, iconRel + ".png");
            boolean rendered = IconRenderer.renderIcon(resolved.mergedJson(), mergedJavaPack, iconFile);
            if (!rendered) {
                BedrockLog.warn("[BedrockConverter] Icon rendering failed for " + leaf.modelRef()
                        + "; using missing-texture placeholder");
                IconRenderer.writeMissingPlaceholder(iconFile);
            }
            iconTextureMap.put(iconKey, iconRel);'''
          assert old in s
          new = '''            String iconRel;
            if (stitch.atlasFile() == null) {
                // Native-fallback models reuse Bedrock's own vanilla icon and texture.
                iconRel = stitch.bedrockTexturePath();
                BedrockLog.debug("[BedrockConverter] Log Horizon LH2: reusing native Bedrock icon for "
                        + leaf.modelRef() + ": " + iconRel);
            } else {
                iconRel = "textures/items/" + iconKey;
                File iconFile = new File(bedrockDir, iconRel + ".png");
                boolean rendered = IconRenderer.renderIcon(resolved.mergedJson(), mergedJavaPack, iconFile);
                if (!rendered) {
                    BedrockLog.warn("[BedrockConverter] Icon rendering failed for " + leaf.modelRef()
                            + "; using missing-texture placeholder");
                    IconRenderer.writeMissingPlaceholder(iconFile);
                }
            }
            iconTextureMap.put(iconKey, iconRel);'''
          s = s.replace(old, new)
          conversion.write_text(s, encoding='utf-8')

          # Add focused regression tests for native vanilla texture reuse.
          test = root / 'resourcepackmanager-bedrock/src/test/java/com/magmaguy/resourcepackmanager/bedrock/converter/LogHorizonNativeTextureFallbackTest.java'
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text(r'''package com.magmaguy.resourcepackmanager.bedrock.converter;

import com.google.gson.JsonArray;
import com.google.gson.JsonObject;
import org.junit.jupiter.api.Test;
import org.junit.jupiter.api.io.TempDir;

import java.nio.file.Path;

import static org.junit.jupiter.api.Assertions.*;

class LogHorizonNativeTextureFallbackTest {

    @TempDir
    Path temp;

    @Test
    void ironSwordUsesNativeBedrockTexture() {
        TextureStitcher.StitchResult result = stitch("sword", "item/iron_sword");
        assertNotNull(result);
        assertNull(result.atlasFile());
        assertEquals("textures/items/iron_sword", result.bedrockTexturePath());
        assertEquals(16, result.atlasWidth());
        assertTrue(result.spriteMap().containsKey("sword"));
    }

    @Test
    void woodenToolUsesBedrockLegacyFilenameAlias() {
        TextureStitcher.StitchResult result = stitch("sword", "item/wooden_sword");
        assertNotNull(result);
        assertEquals("textures/items/wood_sword", result.bedrockTexturePath());
    }

    @Test
    void multipleVanillaTexturesStillRequireRealStitching() {
        JsonObject model = model("blade", "item/iron_sword");
        model.getAsJsonObject("textures").addProperty("handle", "item/stick");
        TextureStitcher.StitchResult result = TextureStitcher.stitchSingleModel(
                "multi", "multi", model,
                temp.resolve("java").toFile(), temp.resolve("bedrock").toFile());
        assertNull(result);
    }

    private TextureStitcher.StitchResult stitch(String slot, String texture) {
        return TextureStitcher.stitchSingleModel(
                "lh2", "lh2", model(slot, texture),
                temp.resolve("java").toFile(), temp.resolve("bedrock").toFile());
    }

    private static JsonObject model(String slot, String texture) {
        JsonObject model = new JsonObject();
        JsonObject textures = new JsonObject();
        textures.addProperty(slot, texture);
        model.add("textures", textures);
        model.add("elements", new JsonArray());
        return model;
    }
}
''', encoding='utf-8')
          PY

      - name: Build and test LH2
        working-directory: upstream
        run: mvn -B -pl resourcepackmanager-bukkit -am clean package

      - name: Prepare artifact
        run: |
          cp upstream/resourcepackmanager-bukkit/target/ResourcePackManager.jar ResourcePackManager-2.3.0-LH2.jar
          jar tf ResourcePackManager-2.3.0-LH2.jar | grep -q 'com/magmaguy/resourcepackmanager/bedrock/converter/TextureStitcher.class'
          jar tf ResourcePackManager-2.3.0-LH2.jar | grep -q 'com/magmaguy/resourcepackmanager/bedrock/BedrockConversion.class'
          sha256sum ResourcePackManager-2.3.0-LH2.jar > ResourcePackManager-2.3.0-LH2.sha256

      - name: Upload LH2
        uses: actions/upload-artifact@v4
        with:
          name: ResourcePackManager-2.3.0-LH2
          path: |
            ResourcePackManager-2.3.0-LH2.jar
            ResourcePackManager-2.3.0-LH2.sha256
          if-no-files-found: error
          retention-days: 14
