name: Publicar Log Horizon Voice

on:
  push:
    branches:
      - main
    paths:
      - "downloads/LogHorizonVoice-latest.apk"
      - "downloads/app-release.apk"
      - ".github/workflows/publish-loghorizon-voice.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/voice-release-validation.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-loghorizon-voice-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório com histórico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar APK oficial
        shell: bash
        run: |
          set -euo pipefail

          APK="downloads/LogHorizonVoice-latest.apk"
          RELEASE_COPY="downloads/app-release.apk"
          EXPECTED_PACKAGE="com.loghorizon.voice"
          EXPECTED_VERSION_CODE="8"
          EXPECTED_VERSION_NAME="0.5.1"

          test -s "$APK"
          test -s "$RELEASE_COPY"
          cmp --silent "$APK" "$RELEASE_COPY" || {
            echo "Os dois APKs publicados não são idênticos."
            exit 1
          }

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"

          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE_NAME="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          VERSION_CODE="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          VERSION_NAME="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")"

          test "$PACKAGE_NAME" = "$EXPECTED_PACKAGE" || {
            echo "Pacote inesperado: $PACKAGE_NAME"
            exit 1
          }
          test "$VERSION_CODE" = "$EXPECTED_VERSION_CODE" || {
            echo "versionCode inesperado: $VERSION_CODE"
            exit 1
          }
          test "$VERSION_NAME" = "$EXPECTED_VERSION_NAME" || {
            echo "versionName inesperado: $VERSION_NAME"
            exit 1
          }
          if grep -q '^application-debuggable' <<< "$BADGING"; then
            echo "O APK está marcado como debug e não pode ser publicado."
            exit 1
          fi

          extract_cert_digest() {
            sed -n -E \
              -e 's/^Signer #[0-9]+ certificate SHA-256 digest: //p' \
              -e 's/^V[0-9.]+ Signer: certificate SHA-256 digest: //p' \
              "$1" | head -n 1 | tr '[:upper:]' '[:lower:]'
          }

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/new-signature.txt
          NEW_CERT="$(extract_cert_digest /tmp/new-signature.txt)"
          test -n "$NEW_CERT" || {
            echo "Não foi possível extrair o certificado da nova versão."
            exit 1
          }

          OLD_CERT=""
          OLD_COMMIT=""
          while read -r candidate_commit; do
            test -n "$candidate_commit" || continue
            if git show "$candidate_commit:$APK" > /tmp/previous-candidate.apk 2>/dev/null &&
               "$APKSIGNER" verify --verbose --print-certs /tmp/previous-candidate.apk > /tmp/candidate-signature.txt 2>/dev/null; then
              candidate_cert="$(extract_cert_digest /tmp/candidate-signature.txt)"
              if test -n "$candidate_cert"; then
                OLD_CERT="$candidate_cert"
                OLD_COMMIT="$candidate_commit"
                break
              fi
            fi
          done < <(git log --format='%H' --skip=1 -- "$APK")

          test -n "$OLD_CERT" || {
            echo "Não foi possível localizar uma versão pública anterior assinada no histórico."
            exit 1
          }

          test "$NEW_CERT" = "$OLD_CERT" || {
            echo "A assinatura da 0.5.1 não corresponde à última versão pública assinada."
            echo "Commit anterior assinado: $OLD_COMMIT"
            echo "Anterior: $OLD_CERT"
            echo "Nova:     $NEW_CERT"
            exit 1
          }

          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK_SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "APK_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APK_CERT_SHA256=$NEW_CERT" >> "$GITHUB_ENV"
          echo "VALIDAÇÃO CONCLUÍDA: pacote=$PACKAGE_NAME versão=$VERSION_NAME code=$VERSION_CODE sha256=$SHA256 certificado=$NEW_CERT"

      - name: Atualizar site e manifesto
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version_code = int(os.environ["APK_VERSION_CODE"])
          version_name = os.environ["APK_VERSION_NAME"]
          sha256 = os.environ["APK_SHA256"]

          manifest_path = Path("app-update.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest.update({
              "enabled": True,
              "versionCode": version_code,
              "versionName": version_name,
              "apkUrl": "https://rogeriomatador.github.io/LogHorizon/downloads/LogHorizonVoice-latest.apk",
              "sha256": sha256,
              "mandatory": False,
              "releaseNotes": (
                  "Novo HUD flutuante compacto e arrastável sobre o Minecraft, painel expansível com controles de voz, "
                  "indicadores de conexão e microfone em tempo real, migração da bolha anterior e melhorias de estabilidade."
              ),
          })
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          script_path = Path("script.js")
          script = script_path.read_text(encoding="utf-8")
          script = re.sub(r'apkVersion:\s*"[^"]+"', f'apkVersion: "{version_name}"', script, count=1)
          script = re.sub(r'nextApkVersion:\s*"[^"]+"', f'nextApkVersion: "{version_name}"', script, count=1)
          script = re.sub(r'releaseReady:\s*(?:true|false)', 'releaseReady: true', script, count=1)
          script_path.write_text(script, encoding="utf-8")

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          index = re.sub(
              r'<span class="download-version">.*?</span>',
              f'<span class="download-version">Android • Versão {version_name}</span>',
              index,
              count=1,
          )
          index = re.sub(
              r'<button class="button button-primary download-button" type="button" title="[^"]*">\s*.*?\s*</button>',
              f'<button class="button button-primary download-button" type="button" title="Baixar Log Horizon Voice {version_name}">\n              BAIXAR V{version_name}\n            </button>',
              index,
              count=1,
              flags=re.S,
          )
          index = re.sub(r'script\.js\?v=[^"]+', 'script.js?v=20260729-4', index, count=1)
          index_path.write_text(index, encoding="utf-8")
          PY

      - name: Publicar metadados validados
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-update.json script.js index.html
          if git diff --cached --quiet; then
            echo "O site e o manifesto já estavam atualizados."
            exit 0
          fi
          git commit -m "Publicar Log Horizon Voice 0.5.1"
          git push
