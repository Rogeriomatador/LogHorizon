name: Build Garden Bedrock Support

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/build-garden-bedrock.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch temporária
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Baixar Garden 2.0.1 oficial
        run: |
          VERSION_JSON="$(curl -fsSL 'https://api.modrinth.com/v2/project/ePND7F16/version')"
          DOWNLOAD_URL="$(printf '%s' "$VERSION_JSON" | jq -r '.[] | select(.version_number == "2.0.1") | .files[] | select(.primary == true) | .url' | head -n 1)"
          test -n "$DOWNLOAD_URL"
          curl -fsSL "$DOWNLOAD_URL" -o /tmp/Garden-2.0.1.jar
          rm -rf /tmp/GardenJar
          mkdir -p /tmp/GardenJar
          unzip -q /tmp/Garden-2.0.1.jar -d /tmp/GardenJar

      - name: Instalar analisador YAML
        run: python -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Gerar suporte Bedrock exato
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import re
          from pathlib import Path

          import yaml

          root = Path('/tmp/GardenJar')
          out = Path('garden-bedrock-output')
          out.mkdir(parents=True, exist_ok=True)

          species = [
              'apple', 'blueberry', 'cherry', 'cranberry', 'grape',
              'lemon', 'lime', 'orange', 'peach', 'raspberry', 'strawberry'
          ]

          texture_url_re = re.compile(r'textures\.minecraft\.net/texture/([0-9a-fA-F]{32,128})')
          vanilla: dict[str, str] = {}
          skulls: dict[str, str] = {}
          source_files: dict[str, str] = {}

          def texture_hash_from_base64(value: str) -> str:
              padded = value + '=' * ((4 - len(value) % 4) % 4)
              decoded = base64.b64decode(padded, validate=False).decode('utf-8')
              try:
                  data = json.loads(decoded)
                  url = data['textures']['SKIN']['url']
                  match = texture_url_re.search(url)
              except Exception:
                  match = texture_url_re.search(decoded)
              if not match:
                  raise ValueError('Base64 sem URL de textura válida')
              return match.group(1).lower()

          for name in species:
              matches = list(root.rglob(f'plants/{name}/plant.yml'))
              if len(matches) != 1:
                  raise RuntimeError(f'{name}: esperava 1 plant.yml e encontrei {len(matches)}')
              path = matches[0]
              source_files[name] = str(path.relative_to(root))
              data = yaml.safe_load(path.read_text(encoding='utf-8')) or {}
              fruit = data.get('fruit') or {}

              material = fruit.get('material')
              texture_b64 = fruit.get('head-texture-base64')
              texture_hash = fruit.get('head-texture') or fruit.get('texture-hash')

              if material:
                  vanilla[name] = str(material).lower().removeprefix('minecraft:')
              elif texture_b64:
                  skulls[name] = texture_hash_from_base64(str(texture_b64))
              elif texture_hash:
                  raw = str(texture_hash)
                  match = texture_url_re.search(raw)
                  skulls[name] = (match.group(1) if match else raw).lower()
              else:
                  raise RuntimeError(f'{name}: fruta sem material e sem textura de cabeça')

          assert len(vanilla) + len(skulls) == len(species)
          assert len(vanilla) == 2, f'Esperava 2 frutas vanilla, encontrei {len(vanilla)}: {vanilla}'
          assert len(skulls) == 9, f'Esperava 9 frutas em cabeças, encontrei {len(skulls)}: {skulls}'
          assert len(set(skulls.values())) == len(skulls), 'Há hashes duplicados entre espécies'

          mapping_lines = [
              '# Log Horizon - Garden 2.0.1 no Bedrock',
              '# Destino:',
              '# plugins/Geyser-Spigot/extensions/geyserdisplayentity/Mappings/garden_fruits.yml',
              '',
              'mappings:'
          ]
          for name, material in vanilla.items():
              mapping_lines.extend([
                  f'  garden_{name}:',
                  f'    type: minecraft:{material}',
                  '    model-data: -1',
                  '    item-identifier: none'
              ])
          mapping = '\n'.join(mapping_lines) + '\n'
          (out / 'garden_fruits.yml').write_text(mapping, encoding='utf-8')

          unique_hashes = list(dict.fromkeys(skulls.values()))
          skull_lines = [
              '# Log Horizon - texturas das frutas do Garden 2.0.1',
              '# NÃO substitua custom-skulls.yml inteiro.',
              '# Copie somente as linhas com hífen para a seção skin-hashes existente.',
              'skin-hashes:'
          ]
          skull_lines.extend(f'  - {value}' for value in unique_hashes)
          (out / 'custom-skulls-GARDEN-ADICIONAR.yml').write_text('\n'.join(skull_lines) + '\n', encoding='utf-8')
          (out / 'garden-skin-hashes.txt').write_text('\n'.join(f'  - {value}' for value in unique_hashes) + '\n', encoding='utf-8')

          diagnostic = [
              'Garden verificado: 2.0.1 oficial do Modrinth',
              f'Frutas vanilla: {len(vanilla)}',
              f'Frutas com cabeça personalizada: {len(skulls)}',
              ''
          ]
          for name in species:
              if name in vanilla:
                  diagnostic.append(f'{name}: VANILLA minecraft:{vanilla[name]} | {source_files[name]}')
              else:
                  diagnostic.append(f'{name}: SKULL {skulls[name]} | {source_files[name]}')
          (out / 'DIAGNOSTICO.txt').write_text('\n'.join(diagnostic) + '\n', encoding='utf-8')

          vanilla_names = ', '.join(f'{name}=minecraft:{material}' for name, material in vanilla.items())
          install = f'''LOG HORIZON - GARDEN 2.0.1 VISÍVEL NO BEDROCK\n\nVALIDAÇÃO AUTOMÁTICA:\n- Frutas vanilla: {vanilla_names}\n- Cabeças personalizadas registradas: {len(skulls)}\n\nARQUIVO 1: garden_fruits.yml\nDestino:\nplugins/Geyser-Spigot/extensions/geyserdisplayentity/Mappings/garden_fruits.yml\n\nNão substitua animated_doors.yml. Os dois arquivos devem permanecer na pasta Mappings.\nEste mapeamento permite mostrar as frutas vanilla mesmo com:\nhide-unmapped-vanilla-displays: true\n\nARQUIVO 2: garden-skin-hashes.txt\nAs linhas deste arquivo devem ser adicionadas em:\nplugins/Geyser-Spigot/custom-skulls.yml\n\nLocalize a seção já existente:\nskin-hashes:\n\ne cole abaixo dela as linhas iniciadas por hífen. Não crie uma segunda seção\nskin-hashes e não apague hashes que já estejam no arquivo.\n\nCONFIGURAÇÃO DO GEYSER:\nConfirme em plugins/Geyser-Spigot/config.yml que o conteúdo personalizado está\nativado, na opção atual equivalente a gameplay.enable-custom-content: true.\n\nPROCEDIMENTO:\n1. Desligue completamente o servidor.\n2. Instale garden_fruits.yml no destino indicado.\n3. Mescle as linhas de garden-skin-hashes.txt em custom-skulls.yml.\n4. Mantenha GeyserDisplayEntity-1.0.11-LH-DOORS-FIX3.jar sem alterações.\n5. Ligue o servidor e aguarde o Geyser gerar/atualizar o pacote de cabeças.\n6. Feche o Minecraft Bedrock no celular.\n7. Apague o pacote Log Horizon/Geyser em Configurações > Armazenamento > Dados em cache.\n8. Entre novamente e aceite o pacote atualizado.\n\nTESTE:\n- As frutas vanilla devem aparecer presas às plantas.\n- A uva e as demais frutas em cabeças devem usar suas texturas, não Steve.\n- A colheita, o XP, as qualidades e as plantas férteis continuam no GardenPlus.\n'''
          (out / 'INSTALACAO.txt').write_text(install, encoding='utf-8')

          print('\n'.join(diagnostic))
          PY

      - name: Validar YAML e checksums
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          for name in ['garden_fruits.yml', 'custom-skulls-GARDEN-ADICIONAR.yml']:
              path = Path('garden-bedrock-output') / name
              with path.open(encoding='utf-8') as f:
                  yaml.safe_load(f)
              print('YAML válido:', name)
          PY
          cd garden-bedrock-output
          sha256sum garden_fruits.yml custom-skulls-GARDEN-ADICIONAR.yml garden-skin-hashes.txt INSTALACAO.txt DIAGNOSTICO.txt > SHA256.txt

      - name: Publicar arquivos para validação
        run: |
          rm -rf generated/garden-bedrock
          mkdir -p generated/garden-bedrock
          cp garden-bedrock-output/* generated/garden-bedrock/
          git config user.name "Log Horizon Build"
          git config user.email "actions@users.noreply.github.com"
          git add generated/garden-bedrock
          if ! git diff --cached --quiet; then
            git commit -m "Gerar pacote Garden Bedrock validado"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Enviar pacote
        uses: actions/upload-artifact@v4
        with:
          name: LogHorizon-Garden-Bedrock-FIX1
          path: garden-bedrock-output/
          if-no-files-found: error
          retention-days: 7
