# LOG HORIZON - CORPSE 1.3.1
# Guarda os itens e o XP no cadáver e libera tudo ao clicar com o botão direito.

name: "<red><bold>Corpo de %p</bold></red>"
label: "<gray>Clique para recuperar seus itens</gray>"

nameAlwaysVisible: true
ignoreEmptyInventories: true

# Faz o cadáver permanecer deitado.
pose: "sleeping"

# Evita destruição acidental; a recuperação acontece pelo clique.
invulnerable: true

# "pop" guarda os itens no cadáver e os libera quando alguém clica nele.
itemTreatment: "pop"
# Guarda também a experiência e a libera junto com os itens.
xpTreatment: "pop"

gravity: true
immovable: true
health: 5
keepVelocity: false

# -1 mantém o cadáver até que os itens sejam recuperados.
# Cadáveres abandonados não desaparecem automaticamente.
lifespan: -1

# Vazio usa a skin do jogador que morreu.
skin: ""

onlyAcceptEntityDamage: false
armAnimation: false
floatOnLiquids: true
scaleAttribute: true
